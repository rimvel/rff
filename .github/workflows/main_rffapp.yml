# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - rffapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deploy at a time, in order: a second merge waits for the first deploy instead of racing it
concurrency:
  group: deploy-rffapp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci

      # Any failing check stops the deploy, so a broken build never reaches the live site
      - name: Check (lint, types, tests, security audit)
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Copy static assets to standalone
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Zip artifact for deployment
        run: |
          cd .next/standalone
          zip -r ../../release.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write #This is required for requesting the JWT

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip release.zip
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BF997DBA942644DB8376F53C44680699 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_56CF018C11D54BD78371129A2D9D4991 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_71F0478882B74123BB28823E12F78872 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'rffapp'
          slot-name: 'Production'
          package: .
          startup-command: 'PORT=8080 node server.js'

      # Azure reports success before it has switched to the new version (it can take a few minutes),
      # so wait until the health check shows this commit; the run fails if it never does
      - name: Wait until the new version is live
        run: |
          want="${GITHUB_SHA::7}"
          for i in $(seq 1 40); do
            live=$(curl -s --max-time 20 https://rffapp.azurewebsites.net/api/health | grep -o '"version":"[^"]*"' | cut -d'"' -f4)
            echo "live version: ${live:-no answer} (waiting for $want)"
            [ "$live" = "$want" ] && exit 0
            sleep 15
          done
          echo "::error::The new version wasn't live after 10 minutes. Check the app in Azure."
          exit 1
